name: English Edition Build

on:
  push:
    branches:
      - english-edition
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "workshop-core/**"
      - "steam-protocol/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/english-edition-ci.yml"

permissions:
  contents: read

jobs:
  build-debug:
    name: Build and lint debug APK
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run Android lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopOnAndroid-English-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Restore release signing keystore
        if: github.event_name == 'push'
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release-key.jks"

      - name: Build signed release APK
        if: github.event_name == 'push'
        env:
          RELEASE_STORE_FILE: ${{ runner.temp }}/release-key.jks
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Upload signed release APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: WorkshopOnAndroid-English-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
